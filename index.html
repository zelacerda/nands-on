<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="description" content="" data-i18n-attr="content:meta.description" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>NANDS-ON — From NAND to CPU</title>

    <!-- Open Graph / Twitter (pré-visualização ao compartilhar o link). -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="NANDS-ON — From NAND to CPU" />
    <meta property="og:description" content="" data-i18n-attr="content:meta.description" />
    <meta property="og:url" content="https://nands-on.com/" />
    <meta property="og:image" content="https://nands-on.com/favicon.svg" />
    <meta name="twitter:card" content="summary" />

    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="editor" data-i18n-attr="aria-label:a11y.editor"></canvas>
    <nav id="palette" data-i18n-attr="aria-label:a11y.palette">
      <button type="button" data-add="input" data-i18n="palette.input"></button>
      <button type="button" data-add="output" data-i18n="palette.output"></button>
      <button type="button" class="logic-btn" data-add="nand">NAND</button>
      <button type="button" id="edit-chip" hidden data-i18n="palette.edit"></button>
      <button type="button" id="delete" hidden data-i18n="palette.delete"></button>
    </nav>

    <button type="button" id="make" hidden data-i18n="make"></button>

    <div id="edit-bar" hidden>
      <span id="edit-label"></span>
      <button type="button" id="finish-edit" data-i18n="editBar.finish"></button>
      <button type="button" id="cancel-edit" data-i18n="editBar.cancel"></button>
    </div>

    <!-- Afordância temporária de desenvolvimento: sempre visível (inclusive no
         deploy) para facilitar testes em outros dispositivos. Ocultar/gated no futuro. -->
    <button type="button" id="clear-db" data-i18n="clearDb"></button>

    <div id="rename-overlay" hidden>
      <input
        id="rename-input"
        type="text"
        autocomplete="off"
        spellcheck="false"
        data-i18n-attr="aria-label:a11y.renameInput"
      />
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
