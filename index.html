<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="description" content="" data-i18n-attr="content:meta.description" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>NANDS-ON — From NAND to CPU</title>

    <!-- Open Graph / Twitter (pré-visualização ao compartilhar o link). -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="NANDS-ON — From NAND to CPU" />
    <meta property="og:description" content="" data-i18n-attr="content:meta.description" />
    <meta property="og:url" content="https://nands-on.com/" />
    <meta property="og:image" content="https://nands-on.com/favicon.svg" />
    <meta name="twitter:card" content="summary" />

    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="editor" data-i18n-attr="aria-label:a11y.editor"></canvas>
    <nav id="palette" data-i18n-attr="aria-label:a11y.palette">
      <button type="button" data-add="input" data-i18n="palette.input"></button>
      <button type="button" data-add="output" data-i18n="palette.output"></button>
      <button type="button" class="logic-btn" data-add="nand">NAND</button>
      <button type="button" id="edit-chip" hidden data-i18n="palette.edit"></button>
      <button type="button" id="delete" hidden data-i18n="palette.delete"></button>
    </nav>

    <button type="button" id="make" hidden data-i18n="make"></button>

    <div id="edit-bar" hidden>
      <span id="edit-label"></span>
      <button type="button" id="finish-edit" data-i18n="editBar.finish"></button>
      <button type="button" id="cancel-edit" data-i18n="editBar.cancel"></button>
    </div>

    <!-- Afordância temporária de desenvolvimento: sempre visível (inclusive no
         deploy) para facilitar testes em outros dispositivos. Ocultar/gated no futuro. -->
    <button type="button" id="clear-db" data-i18n="clearDb"></button>

    <!-- Botão "?" que abre o painel Sobre. -->
    <button
      type="button"
      id="about-btn"
      data-i18n="about.button"
      data-i18n-attr="aria-label:a11y.about"
    ></button>

    <!-- Painel "Sobre" — também exibido como boas-vindas no primeiro acesso. -->
    <div id="about-overlay" hidden>
      <div id="about-panel" role="dialog" aria-modal="true" aria-labelledby="about-title">
        <h1 id="about-title">
          <span class="about-name" data-i18n="app.name"></span>
          <span class="about-tagline" data-i18n="app.tagline"></span>
        </h1>
        <p class="about-intro" data-i18n="about.intro"></p>
        <h2 class="about-credits-title" data-i18n="about.creditsTitle"></h2>
        <p data-i18n="about.author"></p>
        <p>
          <span data-i18n="about.inspiredBy"></span>
          <a
            href="https://github.com/SebLague/Digital-Logic-Sim"
            target="_blank"
            rel="noopener"
            data-i18n="about.dlsLink"
          ></a>
        </p>
        <p>
          <a
            href="https://github.com/zelacerda/nands-on"
            target="_blank"
            rel="noopener"
            data-i18n="about.repoLink"
          ></a>
        </p>
        <label class="about-dismiss">
          <input type="checkbox" id="about-dont-show" />
          <span data-i18n="about.dontShowAgain"></span>
        </label>
        <button type="button" id="about-close" data-i18n="about.close"></button>
      </div>
    </div>

    <!-- Callout do tutorial (não-bloqueante): guia o passo atual. -->
    <div id="tutorial-callout" hidden>
      <button type="button" id="tutorial-exit" data-i18n-attr="aria-label:tutorial.exit">×</button>
      <div class="tutorial-progress" id="tutorial-progress"></div>
      <p class="tutorial-text" id="tutorial-text"></p>
    </div>

    <div id="rename-overlay" hidden>
      <input
        id="rename-input"
        type="text"
        autocomplete="off"
        spellcheck="false"
        data-i18n-attr="aria-label:a11y.renameInput"
      />
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
