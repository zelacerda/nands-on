<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="description" content="From NAND to CPU — simulador de lógica digital no browser." />
    <title>From NAND to CPU</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="editor" aria-label="Editor de circuitos"></canvas>
    <nav id="palette" aria-label="Paleta de componentes">
      <button type="button" data-add="input">Entrada</button>
      <button type="button" data-add="output">Saída</button>
      <button type="button" class="logic-btn" data-add="nand">NAND</button>
      <button type="button" id="edit-chip" hidden>Editar</button>
      <button type="button" id="delete" hidden>Excluir</button>
    </nav>

    <button type="button" id="make" hidden>Fazer</button>

    <div id="edit-bar" hidden>
      <span id="edit-label"></span>
      <button type="button" id="finish-edit">Salvar edição</button>
      <button type="button" id="cancel-edit">Cancelar</button>
    </div>

    <div id="name-dialog" hidden role="dialog" aria-modal="true" aria-labelledby="name-title">
      <div class="dialog-box">
        <label id="name-title" for="chip-name">Nome do componente</label>
        <input id="chip-name" type="text" autocomplete="off" spellcheck="false" />
        <p id="name-error" class="error" hidden></p>
        <div class="dialog-actions">
          <button type="button" id="name-cancel">Cancelar</button>
          <button type="button" id="name-confirm">Criar</button>
        </div>
      </div>
    </div>

    <!-- Afordância temporária de desenvolvimento: sempre visível (inclusive no
         deploy) para facilitar testes em outros dispositivos. Ocultar/gated no futuro. -->
    <button type="button" id="clear-db">Limpar banco</button>

    <div id="rename-overlay" hidden>
      <input
        id="rename-input"
        type="text"
        autocomplete="off"
        spellcheck="false"
        aria-label="Nome da entrada ou saída"
      />
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
