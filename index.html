<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="description" content="" data-i18n-attr="content:meta.description" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>NANDS-ON — From NAND to CPU</title>

    <!-- Open Graph / Twitter (pré-visualização ao compartilhar o link). -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="NANDS-ON — From NAND to CPU" />
    <meta property="og:description" content="" data-i18n-attr="content:meta.description" />
    <meta property="og:url" content="https://nands-on.com/" />
    <meta property="og:image" content="https://nands-on.com/favicon.svg" />
    <meta name="twitter:card" content="summary" />

    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="editor" data-i18n-attr="aria-label:a11y.editor"></canvas>

    <!-- Dock esquerdo: barra vertical de componentes. IN/OUT não ficam na paleta;
         são criados arrastando um pino de componente para o espaço vazio. -->
    <div id="left-dock">
      <!-- Barra vertical de componentes: lista rolável + "Make" ancorado embaixo. -->
      <nav id="palette" data-i18n-attr="aria-label:a11y.palette">
        <button type="button" id="palette-scroll-up" class="palette-scroll" hidden aria-hidden="true">
          ▲
        </button>
        <div id="palette-list">
          <button type="button" class="logic-btn" data-add="nand">
            <span class="drag-handle" data-icon="drag-vertical" aria-hidden="true"></span>
            <span class="palette-label">NAND</span>
          </button>
        </div>
        <button type="button" id="palette-scroll-down" class="palette-scroll" hidden aria-hidden="true">
          ▼
        </button>
        <button type="button" id="make" hidden data-icon="add-plus">
          <span class="make-label" data-i18n="make"></span>
        </button>
      </nav>
    </div>

    <!-- Barra de edição de chip (modo edição), no topo-centro. -->
    <div id="edit-bar" hidden>
      <span id="edit-label"></span>
      <button type="button" id="finish-edit" data-icon="check-big" data-i18n-attr="aria-label:editBar.finish"></button>
      <button type="button" id="cancel-edit" data-icon="close-md" data-i18n-attr="aria-label:editBar.cancel"></button>
    </div>

    <!-- Menu de comandos (≡), no topo-direita. Ícone hamburger, só ícone. -->
    <button
      type="button"
      id="menu-btn"
      data-icon="hamburger"
      data-i18n-attr="aria-label:a11y.menu"
    ></button>
    <div id="commands-menu" hidden role="menu" aria-label="Commands">
      <div class="menu-title" data-i18n="menu.title"></div>
      <!-- Ajuda: resumo das principais funcionalidades, primeiro item do menu. -->
      <button type="button" id="cmd-help" class="menu-item" role="menuitem" data-icon="help">
        <span class="menu-item-label" data-i18n="menu.help"></span>
      </button>
      <div class="menu-divider" role="separator"></div>
      <!-- Import/Export: importa/exporta a biblioteca de chips como .json versionado. -->
      <button type="button" id="cmd-import" class="menu-item" role="menuitem" data-icon="file-upload">
        <span class="menu-item-label" data-i18n="menu.import"></span>
      </button>
      <button type="button" id="cmd-export" class="menu-item" role="menuitem" data-icon="file-download">
        <span class="menu-item-label" data-i18n="menu.export"></span>
      </button>
      <!-- Limpar banco: afordância temporária de desenvolvimento. -->
      <button type="button" id="clear-db" class="menu-item" role="menuitem" data-icon="warning">
        <span class="menu-item-label" data-i18n="clearDb"></span>
      </button>
      <div class="menu-divider" role="separator"></div>
      <button type="button" id="cmd-about" class="menu-item" role="menuitem" data-icon="info">
        <span class="menu-item-label" data-i18n="menu.about"></span>
      </button>
    </div>

    <!-- Barra de ações contextual (inferior-centro): aparece com item selecionado. -->
    <div id="action-bar" hidden>
      <button type="button" id="action-edit" hidden data-icon="edit-pencil" data-i18n-attr="aria-label:action.edit"></button>
      <button type="button" id="action-rename" hidden data-icon="text" data-i18n-attr="aria-label:action.rename"></button>
      <button type="button" id="action-delete" hidden data-icon="trash" data-i18n-attr="aria-label:action.delete"></button>
    </div>

    <!-- Painel "Sobre" — também exibido como boas-vindas no primeiro acesso. -->
    <div id="about-overlay" hidden>
      <div id="about-panel" role="dialog" aria-modal="true" aria-labelledby="about-title">
        <h1 id="about-title">
          <span class="about-name" data-i18n="app.name"></span>
          <span class="about-tagline" data-i18n="app.tagline"></span>
        </h1>
        <p class="about-intro" data-i18n="about.intro"></p>
        <h2 class="about-credits-title" data-i18n="about.creditsTitle"></h2>
        <p>
          <span data-i18n="about.author"></span>
          (<a
            href="https://github.com/zelacerda/nands-on"
            target="_blank"
            rel="noopener"
            data-i18n="about.repoLink"
          ></a>)
        </p>
        <p>
          <span data-i18n="about.inspiredBy"></span>
          <a
            href="https://github.com/SebLague/Digital-Logic-Sim"
            target="_blank"
            rel="noopener"
            data-i18n="about.dlsLink"
          ></a>
        </p>
        <p class="about-icons-credit">
          <span data-i18n="about.iconsBy"></span>
          <a
            href="https://github.com/krystonschwarze/coolicons?ref=svgrepo.com"
            target="_blank"
            rel="noopener"
            data-i18n="about.iconsAuthor"
          ></a>
          <span data-i18n="about.iconsLicenseVia"></span>
          <a
            href="https://www.svgrepo.com/"
            target="_blank"
            rel="noopener"
            data-i18n="about.iconsRepo"
          ></a>
        </p>
        <label class="about-dismiss">
          <input type="checkbox" id="about-dont-show" />
          <span data-i18n="about.dontShowAgain"></span>
        </label>
        <button type="button" id="about-close" data-icon="check-big">
          <span class="about-close-label" data-i18n="about.close"></span>
        </button>
      </div>
    </div>

    <!-- Painel "Help" — resumo das principais funcionalidades. -->
    <div id="help-overlay" hidden>
      <div
        id="help-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="help-title"
        data-i18n-attr="aria-label:a11y.help"
      >
        <h1 id="help-title" data-i18n="help.title"></h1>
        <p class="help-intro" data-i18n="help.intro"></p>
        <ul class="help-list">
          <li data-i18n="help.feature.palette"></li>
          <li data-i18n="help.feature.io"></li>
          <li data-i18n="help.feature.wire"></li>
          <li data-i18n="help.feature.toggle"></li>
          <li data-i18n="help.feature.make"></li>
          <li data-i18n="help.feature.persist"></li>
        </ul>
        <button type="button" id="help-close" data-icon="check-big">
          <span data-i18n="help.close"></span>
        </button>
      </div>
    </div>

    <!-- Destaque do tutorial: overlay flutuante posicionado sobre o alvo do passo.
         Vive na raiz do DOM para não ser recortado por containers roláveis. -->
    <div id="tutorial-highlight" hidden aria-hidden="true"></div>

    <!-- Callout do tutorial (não-bloqueante): guia o passo atual. -->
    <div id="tutorial-callout" hidden>
      <button type="button" id="tutorial-exit" data-i18n-attr="aria-label:tutorial.exit">×</button>
      <div class="tutorial-progress" id="tutorial-progress"></div>
      <p class="tutorial-text" id="tutorial-text"></p>
    </div>

    <div id="rename-overlay" hidden>
      <input
        id="rename-input"
        type="text"
        autocomplete="off"
        spellcheck="false"
        data-i18n-attr="aria-label:a11y.renameInput"
      />
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
